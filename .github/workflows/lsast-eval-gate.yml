name: LSAST eval gate

# Detector-recall regression gate (roadmap W8). Runs the curated detector tier
# through scripts/eval/run_eval.py --gate, which exits non-zero when the §9
# thresholds (F1 >= 0.70, recall >= 0.60, FP-rate <= 0.25) are not met. This
# fails the build if a rule/normalizer change silently drops detection.
#
# Fidelity note: CI uses *real* Semgrep (`pip install semgrep`, the only engine
# that installs on Linux) + the upstream semgrep-rules tree, whereas the desktop
# build ships OpenGrep + the bundled rules. The curated fixtures were tuned
# against the bundled tree; the two engines detect the same well-known classes,
# but pin SEMGREP_RULES_REF below if upstream rule drift ever moves a result.

on:
  pull_request:
    paths:
      - "server/scanner/rag/**"
      - "scripts/eval/**"
      - ".github/workflows/lsast-eval-gate.yml"
  push:
    branches: [main, lsast-handoff-2026-05-31]
  workflow_dispatch: {}

jobs:
  detector-gate:
    runs-on: ubuntu-latest
    env:
      # Pin to keep the gate reproducible across upstream rule changes.
      # Leave empty to track the semgrep-rules default branch.
      SEMGREP_RULES_REF: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server deps + Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          # requirements.txt already pins semgrep for the Railway/Linux path;
          # install explicitly in case a future split drops it from there.
          pip install semgrep

      - name: Stage Semgrep rules (valid --config target)
        run: |
          REF_ARG=""
          if [ -n "$SEMGREP_RULES_REF" ]; then REF_ARG="--ref $SEMGREP_RULES_REF"; fi
          python scripts/offline_sbom/stage_semgrep_rules.py "$RUNNER_TEMP/semgrep-rules" $REF_ARG
          echo "RULES_DIR=$RUNNER_TEMP/semgrep-rules" >> "$GITHUB_ENV"

      - name: Detector regression gate (curated)
        run: |
          cd scripts/eval
          PYTHONPATH=../../server \
            SEMGREP_BIN="$(command -v semgrep)" \
            SEMGREP_RULES_DIR="$RULES_DIR" \
            python run_eval.py --dataset curated --tier detector --gate
