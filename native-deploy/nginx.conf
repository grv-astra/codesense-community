# Native Windows nginx config for the client VM (no Docker).
# Adapted from docker/nginx.conf: same /api,/admin,/static routing to the
# backend, upstream changed from the Docker service name "backend:8585" to
# 127.0.0.1:8585 (codesense-server.exe running locally on the same box).
#
# Difference from the Docker version: there is no separate "frontend"
# container here. nginx serves client/dist directly as static files, so a
# try_files SPA fallback is added (client-side routing needs every unknown
# path to fall back to index.html, or a browser refresh on e.g. /findings/42
# 404s instead of loading the app).
#
# BEFORE STARTING: edit the `root` path below to wherever client/dist was
# copied on this machine.
#
# NOTE: this is a COMPLETE nginx.conf (events{} + http{} included), meant to
# fully replace conf/nginx.conf in the nginx-for-Windows distribution — the
# Docker version of this file was only a server{} fragment because the
# official nginx Docker image supplies its own events{}/http{} wrapper and
# includes conf.d/*.conf; a standalone Windows nginx.exe has no such wrapper.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;

        client_max_body_size 200m;  # zip-upload scans

        location /api/ {
            proxy_pass http://127.0.0.1:8585;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /admin/ {
            proxy_pass http://127.0.0.1:8585;
            proxy_set_header Host $host;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8585;
            proxy_set_header Host $host;
        }

        location / {
            root   C:/codesense/client-dist;   # <-- EDIT THIS on-site
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
