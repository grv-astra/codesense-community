rules:
- id: hardcoded-ssn-literal
  pattern-regex: '\b\d{3}-\d{2}-\d{4}\b'
  languages: [regex]
  message: >-
    A hardcoded value matching the US Social Security Number format
    (###-##-####) was found in source. Real or realistic-looking SSNs should
    never be committed to source control, including as test/sample data.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-359: Exposure of Private Personal Information to an Unauthorized Actor'
    category: security
    subcategory: [privacy]
    technology: [privacy]
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH

- id: hardcoded-credit-card-literal
  pattern-regex: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
  languages: [regex]
  message: >-
    A hardcoded value matching a common credit-card number format
    (Visa/Mastercard/Amex/Discover) was found in source. Real or
    realistic-looking card numbers should never be committed to source
    control, including as test/sample data.
  severity: ERROR
  metadata:
    cwe:
    - 'CWE-359: Exposure of Private Personal Information to an Unauthorized Actor'
    category: security
    subcategory: [privacy]
    technology: [privacy]
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: HIGH
