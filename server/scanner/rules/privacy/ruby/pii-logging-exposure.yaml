rules:
- id: ruby-pii-logging-exposure
  languages: [ruby]
  severity: ERROR
  message: >-
    A value that looks like personal data (based on its name) is passed
    directly to a logging/puts call. Logs are frequently retained, shipped to
    third parties, or accessed with broader permissions than the data
    warrants — avoid writing PII to logs, or mask/redact it first.
  metadata:
    cwe:
    - 'CWE-532: Insertion of Sensitive Information into Log File'
    category: security
    subcategory: [privacy]
    technology: [privacy]
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
  patterns:
    - pattern-either:
        - pattern: puts $ARG
        - pattern: Rails.logger.$METHOD($ARG)
        # $LOGGER is unconstrained -- without the $METHOD whitelist below this
        # branch matches ANY single-arg method call, not just real logger
        # calls. Scope it to method names that actually mean "log this".
        - patterns:
            - pattern: $LOGGER.$METHOD($ARG)
            - metavariable-regex:
                metavariable: $METHOD
                regex: (?i)^(log[a-z]*|debug|info|warn|warning|error|err|exception|critical|fatal|trace|notice|alert|emergency|write|writeline|println|printf|unknown)$
    - metavariable-regex:
        metavariable: $ARG
        regex: (?is).*(ssn|social_security|socialsecurity|email|credit_?card|cardnumber|card_number|cvv|passport|national_?id|driver_?licen[cs]e|date_?of_?birth|\bdob\b|phone_?number|home_?address|street_?address|mailing_?address|bank_?account|routing_?number|iban|tax_?id|medical_?record|health_?record|patient_?id).*
