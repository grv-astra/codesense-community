<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSense</title>
    <!-- Body copy is set in WF Visual Sans Regular everywhere — fetch it in parallel
         with the JS so first paint doesn't wait on the font, then swap without FOUT. -->
    <link rel="preload" href="/fonts/WF-Sans/Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/WF-Sans/Medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <div id="initial-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F0F0F0;z-index:9999;">
      <div style="width:32px;height:32px;border:3px solid rgba(128,128,128,0.3);border-top-color:#bf0000;border-radius:50%;animation:initial-loader-spin 0.8s linear infinite;"></div>
    </div>
    <style>
      @keyframes initial-loader-spin { to { transform: rotate(360deg); } }
      /* Once React mounts real content into #root, hide the static loader — no JS timing needed. */
      #root:not(:empty) + #initial-loader { display: none !important; }
    </style>
    <script>
      // Match the app's persisted theme before paint so the loader background doesn't flash.
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        var loader = document.getElementById('initial-loader');
        if (loader) loader.style.background = '#595959';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
